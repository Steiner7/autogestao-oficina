services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_mecanica
    ports:
      - "5432:5432"
    volumes:
      - ./database/db_mecanica.sql:/docker-entrypoint-initdb.d/01_db_mecanica.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
